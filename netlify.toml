[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/props/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/chars/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/tex/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
